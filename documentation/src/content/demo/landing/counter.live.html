<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #fafafa;
      }
      .counter {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      button {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        border: none;
        background: hsl(28, 100%, 58%);
        color: white;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: hsl(28, 100%, 50%);
      }
      #count {
        font-size: 40px;
        font-weight: 700;
        min-width: 56px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="counter">
      <button id="decrement" aria-label="Decrement">−</button>
      <span id="count">0</span>
      <button id="increment" aria-label="Increment">+</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
